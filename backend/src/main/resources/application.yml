spring:
  application:
    name: unified-exam-platform-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/unified_exam_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  servlet:
    session:
      # 与独立 SHSAT 系统的 24 小时登录凭证保持一致，并允许部署环境显式覆盖。
      timeout: ${SESSION_TIMEOUT:24h}

logging:
  level:
    com.unifiedexam.platform: INFO

platform:
  uploads:
    sat-import-materials-directory: ${SAT_IMPORT_MATERIALS_DIRECTORY:uploads/sat-import/materials}
  session:
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    max-age: ${SESSION_MAX_AGE:24h}
